name: Bug Report
description: Report a bug or issue with SkyOps CLI
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug! Please fill out the information below to help us diagnose and fix the issue.

  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission Checklist
      description: Please check the following before submitting
      options:
        - label: I have searched existing issues for similar problems
          required: true
        - label: I have read the documentation and troubleshooting guide
          required: true
        - label: I am using the latest version of SkyOps CLI
          required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is
      placeholder: Describe the issue you're experiencing...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Detailed steps to reproduce the issue
      placeholder: |
        1. Run command `skyops ...`
        2. Configure with `...`
        3. See error `...`
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen
      placeholder: Describe what should have happened...
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened
      placeholder: Describe what actually happened...
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: Which platform are you using?
      options:
        - Linux (x64)
        - Linux (ARM64)
        - macOS (Intel)
        - macOS (Apple Silicon)
        - Windows (x64)
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: SkyOps CLI Version
      description: Output of `skyops version`
      placeholder: v1.0.0
    validations:
      required: true

  - type: textarea
    id: system
    attributes:
      label: System Information
      description: Output of `skyops system info` (if available)
      placeholder: Paste system information here...

  - type: textarea
    id: gpu
    attributes:
      label: GPU Information
      description: Output of `nvidia-smi` and `skyops gpu status` (if applicable)
      placeholder: Paste GPU information here...

  - type: textarea
    id: logs
    attributes:
      label: Log Output
      description: Relevant log entries or error messages
      placeholder: Paste log output here...

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other context about the problem
      placeholder: Add any other context here...
